{% macro card(p) %}<figure class="card photo tilt reveal" data-cat="{{ p.cat }}"><div class="img" data-full="{{ url_for('static', filename=p.path) }}" style="background-image:url('{{ url_for('static', filename=p.path) }}')"></div><figcaption><small class="gold">{{ p.label }}</small><h3>{{ p.title }}</h3><a class="link" href="{{ url_for('contact') }}">Enquire →</a></figcaption></figure>{% endmacro %}
{% macro empty() %}<div class="card center">Photos not downloaded yet. Run <b>python get_photos.py YOUR_KEY</b> in the terminal.</div>{% endmacro %}
{% macro catcard(c) %}<a class="card catcard tilt reveal" href="{{ url_for('gallery', cat=c.cat) }}"><div class="img" style="background-image:url('{{ url_for('static', filename=c.cover) }}')"><span class="badge">{{ c.count }} Designs</span></div><h3>{{ c.label }}</h3><p>{{ c.desc }}</p><span class="link">View Gallery →</span></a>{% endmacro %}
